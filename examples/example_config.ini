# Example configuration for the LNS-SAT executable (run from build/)
map = ../mapf-map/random-32-32-10.map
scenario = ../mapf-scen-even/scen-even/random-32-32-10-even-1.scen
num_agents = 10
scenario_index = 0
seed = 42
variant = lns-sat
makespan_increment = 1
makespan_increase_limit = 10
lazy_iteration_limit = 10000000
full_map_fallback_threshold = 0.95
